i2c:
  - id: i2c_touch
    setup_priority: 400
    sda: GPIO6
    scl: GPIO7
    scan: true
    frequency: 400kHz

output:
  - platform: ledc
    pin: GPIO46
    id: gpio_3_backlight_pwm
  - platform: gpio
    id: power_light
    pin: GPIO40
  - platform: gpio
    id: out4
    pin: GPIO4
  - platform: gpio
    id: out12
    pin: GPIO12
  - platform: gpio
    id: out1
    pin: GPIO1
  - platform: gpio
    id: out2
    pin: GPIO2

spi:
  id: spi_bus
  mosi_pin: GPIO11
  clk_pin: GPIO10

# WARNING The 'ili9xxx' component is deprecated, 
# it is recommended to use 'mipi_spi' instead.
display:
  - platform: ili9xxx
    id: round_display
    model: GC9A01A
    cs_pin: GPIO9
    reset_pin: GPIO14
    dc_pin: GPIO3
    invert_colors: true
    rotation: 0
    show_test_card: false
    update_interval: never
    auto_clear_enabled: false

globals:
  - id: swipe_start_x
    type: int
    initial_value: '-1'
  - id: swipe_cur_x
    type: int
    initial_value: '0'
  - id: swipe_start_y
    type: int
    initial_value: '0'
  - id: swipe_cur_y
    type: int
    initial_value: '0'
  - id: swipe_gesture_handled
    type: bool
    initial_value: 'false'

touchscreen:
  - platform: cst816
    id: touch
    i2c_id: i2c_touch
    address: 0x15
    interrupt_pin: GPIO5
    reset_pin: GPIO13
    skip_probe: true
    transform:
      mirror_x: false
      mirror_y: true
      swap_xy: true
    on_touch:
      - script.execute:
          id: dial_register_activity
          source: "touch"
      - lambda: |-
          if (id(in_light) && id(btn_palette) != nullptr) {
            lv_area_t palette_area;
            lv_obj_get_coords(id(btn_palette), &palette_area);
            const bool palette_hit = touch.x >= palette_area.x1 && touch.x <= palette_area.x2 &&
                                     touch.y >= palette_area.y1 && touch.y <= palette_area.y2;
            ESP_LOGI("touch_map", "mapped=(%d,%d) raw=(%d,%d) palette=[%d,%d..%d,%d] hit=%s",
                     touch.x, touch.y, touch.x_raw, touch.y_raw,
                     palette_area.x1, palette_area.y1, palette_area.x2, palette_area.y2,
                     palette_hit ? "yes" : "no");
          }
          if (id(idle_event_consumed)) {
            id(idle_touch_sequence_consumed) = true;
            id(swipe_gesture_handled) = true;
            id(swipe_start_x) = -1;
            id(dial_idle_block_lvgl_input).execute();
            return;
          }
          if (id(swipe_start_x) < 0) {
            id(swipe_start_x) = touch.x;
            id(swipe_start_y) = touch.y;
            id(swipe_gesture_handled) = false;
            ESP_LOGI("swipe", "SWIPE start x=%d y=%d", touch.x, touch.y);
          }
          id(swipe_cur_x) = touch.x;
          id(swipe_cur_y) = touch.y;
    on_update:
      - lambda: |-
          if (id(idle_touch_sequence_consumed)) return;
          if (id(swipe_start_x) < 0 || touches.empty()) return;
          const auto &touch = touches[0];
          id(swipe_cur_x) = touch.x;
          id(swipe_cur_y) = touch.y;
    on_release:
      - lambda: |-
          if (id(idle_touch_sequence_consumed)) {
            id(swipe_start_x) = -1;
            id(swipe_cur_x) = 0;
            id(swipe_cur_y) = 0;
            id(swipe_gesture_handled) = true;
            id(idle_touch_sequence_consumed) = false;
            id(idle_event_consumed) = false;
            id(dial_idle_unblock_lvgl_input).execute();
            return;
          }
          if (id(swipe_start_x) < 0) {
            ESP_LOGI("swipe", "SWIPE ignored reason=no_start");
            return;
          }
          if (id(swipe_gesture_handled)) {
            ESP_LOGI("swipe", "SWIPE ignored reason=already_handled");
            return;
          }
          const int dx = id(swipe_cur_x) - id(swipe_start_x);
          const int dy = id(swipe_cur_y) - id(swipe_start_y);
          ESP_LOGI("swipe", "SWIPE end x=%d y=%d dx=%d dy=%d",
                   id(swipe_cur_x), id(swipe_cur_y), dx, dy);
          id(swipe_start_x) = -1;
          // A normal tap is left to LVGL and its widget-specific handler.
          // Only a clearly horizontal drag is considered navigation.
          if (abs(dx) < 50) {
            ESP_LOGI("swipe", "SWIPE ignored reason=horizontal_distance");
            return;
          }
          if (abs(dy) >= abs(dx)) {
            ESP_LOGI("swipe", "SWIPE ignored reason=not_horizontal");
            return;
          }
          id(swipe_gesture_handled) = true;
          if (dx < 0) {
            ESP_LOGI("swipe", "SWIPE dispatch direction=left");
            id(dial_gesture_left).execute();
          } else {
            ESP_LOGI("swipe", "SWIPE dispatch direction=right");
            id(dial_gesture_right).execute();
          }

light:
  - platform: monochromatic
    name: "Backlight"
    output: gpio_3_backlight_pwm
    id: display_backlight
    restore_mode: ALWAYS_ON

sensor:
  - platform: rotary_encoder
    id: encoder
    name: "Encoder"
    pin_a:
      number: GPIO45
      mode: INPUT_PULLUP
    pin_b:
      number: GPIO42
      mode: INPUT_PULLUP
    resolution: 1
    min_value: -100000
    max_value: 100000
    on_clockwise:
      - script.execute:
          id: dial_register_activity
          source: "encoder"
      - if:
          condition:
            lambda: 'return !id(idle_event_consumed);'
          then:
            - if:
                condition:
                  lambda: 'return id(in_light_selector);'
                then:
                  - lambda: |-
                      if (id(selector_carousel).is_animating()) {
                        return;
                      }
                      const int before = id(light_selector_encoder_accum);
                      const int after = before + 1;
                      id(light_selector_encoder_accum) = after;
                      if (after < ${encoder_control_steps}) {
                        return;
                      }
                      id(light_selector_encoder_accum) = 0;
                      id(light_selector_scroll_down).execute();
                else:
                  - if:
                      condition:
                        lambda: 'return id(in_colorpicker);'
                      then:
                        - if:
                            condition:
                              lambda: 'return id(light_color_picker_mode) == 1;'
                            then:
                              - script.execute: light_kelvin_up
                            else:
                              - script.execute: light_hue_up
                      else:
                        - if:
                            condition:
                              lambda: 'return id(in_light) && !id(in_menu);'
                            then:
                              - script.execute: light_brightness_up
                            else:
                              - if:
                                  condition:
                                    lambda: 'return id(in_air) && !id(in_menu);'
                                  then:
                                    - lambda: |-
                                        if (id(air_encoder_step_accum) < 0) id(air_encoder_step_accum) = 0;
                                        id(air_encoder_step_accum) += 1;
                                        if (id(air_encoder_step_accum) >= ${encoder_control_steps}) {
                                          id(air_encoder_step_accum) = 0;
                                          if (id(air_control_mode) == 0) {
                                            id(air_temp_up).execute();
                                          } else if (id(air_control_mode) == 1) {
                                            id(air_fan_step).execute(1);
                                          } else {
                                            id(air_hvac_step).execute(1);
                                          }
                                        }
                                  else:
                                    - if:
                                        condition:
                                          lambda: 'return id(in_music);'
                                        then:
                                          - script.execute: music_volume_up
                                        else:
                                          - if:
                                              condition:
                                                lambda: 'return id(in_menu);'
                                              then:
                                                - script.execute: menu_scroll_down
                                              else:
                                                - if:
                                                    condition:
                                                      lambda: 'return id(in_timer);'
                                                    then:
                                                      - script.execute: timer_encoder_up
    on_anticlockwise:
      - script.execute:
          id: dial_register_activity
          source: "encoder"
      - if:
          condition:
            lambda: 'return !id(idle_event_consumed);'
          then:
            - if:
                condition:
                  lambda: 'return id(in_light_selector);'
                then:
                  - lambda: |-
                      if (id(selector_carousel).is_animating()) {
                        return;
                      }
                      const int before = id(light_selector_encoder_accum);
                      const int after = before - 1;
                      id(light_selector_encoder_accum) = after;
                      if (after > -${encoder_control_steps}) {
                        return;
                      }
                      id(light_selector_encoder_accum) = 0;
                      id(light_selector_scroll_up).execute();
                else:
                  - if:
                      condition:
                        lambda: 'return id(in_colorpicker);'
                      then:
                        - if:
                            condition:
                              lambda: 'return id(light_color_picker_mode) == 1;'
                            then:
                              - script.execute: light_kelvin_down
                            else:
                              - script.execute: light_hue_down
                      else:
                        - if:
                            condition:
                              lambda: 'return id(in_light) && !id(in_menu);'
                            then:
                              - script.execute: light_brightness_down
                            else:
                              - if:
                                  condition:
                                    lambda: 'return id(in_air) && !id(in_menu);'
                                  then:
                                    - lambda: |-
                                        if (id(air_encoder_step_accum) > 0) id(air_encoder_step_accum) = 0;
                                        id(air_encoder_step_accum) -= 1;
                                        if (id(air_encoder_step_accum) <= -${encoder_control_steps}) {
                                          id(air_encoder_step_accum) = 0;
                                          if (id(air_control_mode) == 0) {
                                            id(air_temp_down).execute();
                                          } else if (id(air_control_mode) == 1) {
                                            id(air_fan_step).execute(-1);
                                          } else {
                                            id(air_hvac_step).execute(-1);
                                          }
                                        }
                                  else:
                                    - if:
                                        condition:
                                          lambda: 'return id(in_music);'
                                        then:
                                          - script.execute: music_volume_down
                                        else:
                                          - if:
                                              condition:
                                                lambda: 'return id(in_menu);'
                                              then:
                                                - script.execute: menu_scroll_up
                                              else:
                                                - if:
                                                    condition:
                                                      lambda: 'return id(in_timer);'
                                                    then:
                                                      - script.execute: timer_encoder_down

binary_sensor:
  - platform: gpio
    name: Button
    id: front_button
    pin:
      number: GPIO41
      inverted: true
    on_state:
      - lambda: |-
          ESP_LOGI("dial_input", "GPIO41 state=%s", x ? "ON" : "OFF");
    on_multi_click:
      - timing:
          - ON for at most 500ms
          - OFF for at most 500ms
          - ON for at most 500ms
          - OFF for at least 40ms
        invalid_cooldown: 150ms
        then:
          - logger.log:
              level: INFO
              format: "Button double click detected"
          - if:
              condition:
                lambda: 'return !id(button_debounce);'
              then:
                - globals.set: {id: button_debounce, value: 'true'}
                - script.execute: dial_back
                - delay: 250ms
                - globals.set: {id: button_debounce, value: 'false'}
      - timing:
          - ON for 50ms to 500ms
          - OFF for at least 520ms
        invalid_cooldown: 150ms
        then:
          - logger.log:
              level: INFO
              format: "Button single click detected"
          - if:
              condition:
                lambda: 'return !id(button_debounce);'
              then:
                - globals.set: {id: button_debounce, value: 'true'}
                - script.execute: dial_back
                - delay: 250ms
                - globals.set: {id: button_debounce, value: 'false'}
