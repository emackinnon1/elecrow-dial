text_sensor:
  - platform: homeassistant
    id: dial_light_${light_sensor_prefix}_state
    entity_id: ${light_entity_id}
    internal: true
    on_value:
      - script.execute: menu_on_ha_update
  - platform: homeassistant
    id: dial_light_${light_sensor_prefix}_modes
    entity_id: ${light_entity_id}
    attribute: supported_color_modes
    internal: true
  - platform: homeassistant
    id: dial_light_${light_sensor_prefix}_rgb
    entity_id: ${light_entity_id}
    attribute: rgb_color
    internal: true
  - platform: homeassistant
    id: dial_light_${light_sensor_prefix}_color_mode
    entity_id: ${light_entity_id}
    attribute: color_mode
    internal: true

sensor:
  - platform: homeassistant
    id: dial_light_${light_sensor_prefix}_brightness
    entity_id: ${light_entity_id}
    attribute: brightness
    internal: true
    on_value:
      - script.execute: menu_on_ha_update
  - platform: homeassistant
    id: dial_light_${light_sensor_prefix}_color_temp_kelvin
    entity_id: ${light_entity_id}
    attribute: color_temp_kelvin
    internal: true
  - platform: homeassistant
    id: dial_light_${light_sensor_prefix}_min_color_temp_kelvin
    entity_id: ${light_entity_id}
    attribute: min_color_temp_kelvin
    internal: true
  - platform: homeassistant
    id: dial_light_${light_sensor_prefix}_max_color_temp_kelvin
    entity_id: ${light_entity_id}
    attribute: max_color_temp_kelvin
    internal: true