    max_color_temp_kelvin_sensor: dial_light_fancy_bulb_standing_max_color_temp_kelvin

packages:
  smart_home_button:
    url: https://github.com/emackinnon1/elecrow-dial
    ref: ${package_ref}
    files:
      - dial.yaml
      - path: src/main/dial_lights_sensors.yaml
        vars:
          light_entity_id: light.living_room_light_group
          light_sensor_prefix: living_room
      - path: src/main/dial_lights_sensors.yaml
        vars:
          light_entity_id: light.living_room_1_light_sengled
          light_sensor_prefix: living_room_1_light
      - path: src/main/dial_lights_sensors.yaml
        vars:
          light_entity_id: light.living_room_2_light_sengled
          light_sensor_prefix: living_room_2_light
      - path: src/main/dial_lights_sensors.yaml
        vars:
          light_entity_id: light.living_room_light_3_thirdreality
          light_sensor_prefix: living_room_light_3
      - path: src/main/dial_lights_sensors.yaml
        vars:
          light_entity_id: light.living_room_light_4_thirdreality
          light_sensor_prefix: living_room_light_4
      - path: src/main/dial_lights_sensors.yaml
        vars:
          light_entity_id: light.living_room_light_5_thirdreality
          light_sensor_prefix: living_room_light_5
      - path: src/main/dial_lights_sensors.yaml
        vars:
          light_entity_id: light.fancy_bulb_standing
          light_sensor_prefix: fancy_bulb_standing
    refresh: 0s