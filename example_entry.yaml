    color_mode_sensor: dial_light_living_room_2_light_color_mode
    color_temp_kelvin_sensor: dial_light_living_room_2_light_color_temp_kelvin
    min_color_temp_kelvin_sensor: dial_light_living_room_2_light_min_color_temp_kelvin
    max_color_temp_kelvin_sensor: dial_light_living_room_2_light_max_color_temp_kelvin
  - entity_id: light.living_room_light_3_thirdreality
    name: Light 3
    state_sensor: dial_light_living_room_light_3_state
    modes_sensor: dial_light_living_room_light_3_modes
    brightness_sensor: dial_light_living_room_light_3_brightness
    color_sensor: dial_light_living_room_light_3_rgb
    color_mode_sensor: dial_light_living_room_light_3_color_mode
    color_temp_kelvin_sensor: dial_light_living_room_light_3_color_temp_kelvin
    min_color_temp_kelvin_sensor: dial_light_living_room_light_3_min_color_temp_kelvin
    max_color_temp_kelvin_sensor: dial_light_living_room_light_3_max_color_temp_kelvin
  - entity_id: light.living_room_light_4_thirdreality
    name: Light 4
    state_sensor: dial_light_living_room_light_4_state
    modes_sensor: dial_light_living_room_light_4_modes
    brightness_sensor: dial_light_living_room_light_4_brightness
    color_sensor: dial_light_living_room_light_4_rgb
    color_mode_sensor: dial_light_living_room_light_4_color_mode
    color_temp_kelvin_sensor: dial_light_living_room_light_4_color_temp_kelvin
    min_color_temp_kelvin_sensor: dial_light_living_room_light_4_min_color_temp_kelvin
    max_color_temp_kelvin_sensor: dial_light_living_room_light_4_max_color_temp_kelvin
  - entity_id: light.living_room_light_5_thirdreality
    name: Light 5
    state_sensor: dial_light_living_room_light_5_state
    modes_sensor: dial_light_living_room_light_5_modes
    brightness_sensor: dial_light_living_room_light_5_brightness
    color_sensor: dial_light_living_room_light_5_rgb
    color_mode_sensor: dial_light_living_room_light_5_color_mode
