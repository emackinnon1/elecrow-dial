substitutions:
  package_ref: main
  asset_ref: ${package_ref}
  timezone: America/Chicago

  weather_entity: weather.openweathermap
  aqi_entity: sensor.chi_sp_illinois_usa_air_quality_index
  light_entity: light.living_room_light_group
  climate_entity: climate.living_room_window_ac
  music_player_entity: media_player.living_room

  screen_return_timeout: 30s
  screen_dim_timeout: 15s
  screen_off_timeout: 60s
  screen_dim_brightness: "20%"

esphome:
  name: bedroom-elecrow-dial
  friendly_name: bedroom elecrow dial

api:
  encryption:
    # Public dummy key for validation. Replace before flashing.
    key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

ota:
  - platform: esphome
    # Public dummy password. Replace before flashing.
    password: change-me-ota-password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: bedroom elecrow Fallback Hotspot
    # Public dummy password. Replace before flashing.
    password: change-me-fallback-password

captive_portal:

dial_lights:
  - entity_id: light.living_room_light_group
    name: Living Room group
    state_sensor: dial_light_living_room_state
    modes_sensor: dial_light_living_room_modes
    brightness_sensor: dial_light_living_room_brightness
    color_sensor: dial_light_living_room_rgb
    color_mode_sensor: dial_light_living_room_color_mode
    color_temp_kelvin_sensor: dial_light_living_room_color_temp_kelvin
    min_color_temp_kelvin_sensor: dial_light_living_room_min_color_temp_kelvin
    max_color_temp_kelvin_sensor: dial_light_living_room_max_color_temp_kelvin
  - entity_id: light.living_room_1_light_sengled
    name: Light 1
    state_sensor: dial_light_living_room_1_light_state
    modes_sensor: dial_light_living_room_1_light_modes
    brightness_sensor: dial_light_living_room_1_light_brightness
    color_sensor: dial_light_living_room_1_light_rgb
    color_mode_sensor: dial_light_living_room_1_light_color_mode
    color_temp_kelvin_sensor: dial_light_living_room_1_light_color_temp_kelvin
    min_color_temp_kelvin_sensor: dial_light_living_room_1_light_min_color_temp_kelvin
    max_color_temp_kelvin_sensor: dial_light_living_room_1_light_max_color_temp_kelvin
  - entity_id: light.living_room_2_light_sengled
    name: Light 2
    state_sensor: dial_light_living_room_2_light_state
    modes_sensor: dial_light_living_room_2_light_modes
